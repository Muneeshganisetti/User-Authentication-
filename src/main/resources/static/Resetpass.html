<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Reset password </title>
</head>
<body>
<div class="reset pass">
    <h2 Align="center">Reset password</h2>
    <form id="resetForm">
        <input type="password" id="newpassword" placeholder="enter your new password" required>
        <br>
        <input type="password" id="confirmpassword" placeholder="re-enter your password" required> <br>
        <button type="submit">Reset Password</button>
    </form>
    <div id="message" style="text-align:center; margin-top:10px;"></div>

</div>
<script src="js/resetpass.js"></script>
</body>
</html>
